name: XAUUSD Trading Bot 24/5

on:
  schedule:
    - cron: '0 */5 * * 1-5'
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      force_restart:
        description: 'Force restart bot'
        required: false
        default: 'false'
  repository_dispatch:
    types: [restart-bot]

env:
  PYTHON_VERSION: '3.11'
  BOT_TIMEOUT: 17000

jobs:
  trading-bot:
    name: Run Trading Bot
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ Dependencies installed"
      
      - name: 🔐 Setup Environment Variables
        run: |
          cat > .env << EOF
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          PAXG_SYMBOL=${{ vars.PAXG_SYMBOL || 'PAXGUSDT' }}
          UPDATE_INTERVAL=${{ vars.UPDATE_INTERVAL || '60' }}
          RISK_LEVEL=${{ vars.RISK_LEVEL || 'medium' }}
          MAX_SIGNALS_PER_HOUR=${{ vars.MAX_SIGNALS_PER_HOUR || '10' }}
          GITHUB_ACTIONS=true
          GITHUB_RUN_ID=${{ github.run_id }}
          GITHUB_REPOSITORY=${{ github.repository }}
          EOF
          echo "✅ Environment configured"
      
      - name: 📂 Setup Data Directory
        run: |
          mkdir -p data logs
          echo "✅ Data directories created"
      
      - name: 🚀 Run Trading Bot
        id: run_bot
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: 1
        run: |
          echo "🚀 Starting trading bot at $(date)"
          timeout ${{ env.BOT_TIMEOUT }} python main.py 2>&1 | tee logs/bot.log || EXIT_CODE=$?
          echo "exit_code=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT
          echo "✅ Bot execution completed"
      
      - name: 📊 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            logs/
            data/
          retention-days: 7
      
      - name: 📢 Notify on Completion
        if: always()
        run: |
          python -c "
          import requests
          import os
          from datetime import datetime
          
          token = '${{ secrets.TELEGRAM_BOT_TOKEN }}'
          chat_id = '${{ secrets.TELEGRAM_CHAT_ID }}'
          
          if not token or not chat_id:
              print('⚠️ Telegram credentials not set')
              exit(0)
          
          status = '✅ Berhasil' if '${{ steps.run_bot.outputs.exit_code }}' == '0' else '⚠️ Restart'
          message = f'''
          🤖 *STATUS BOT TRADING*
          
          Status: {status}
          Waktu: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}
          Run ID: ${{ github.run_id }}
          
          Bot akan restart otomatis untuk operasi 24/5
          '''
          
          try:
              requests.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  data={'chat_id': chat_id, 'text': message, 'parse_mode': 'Markdown'},
                  timeout=10
              )
          except Exception as e:
              print(f'Notification error: {e}')
          "
      
      - name: 🔄 Trigger Next Run
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const nextRun = new Date(Date.now() + 5 * 60 * 60 * 1000);
            console.log(`Next scheduled run: ${nextRun.toISOString()}`);
            
            try {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'restart-bot'
              });
              console.log('✅ Dispatch event created');
            } catch (error) {
              console.log(`⚠️ Failed to create dispatch: ${error.message}`);
            }

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: trading-bot
    if: always()
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔍 Check Recent Workflow Runs
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'trading-bot.yml',
                per_page: 5
              });
              
              const workflowRuns = runs.data.workflow_runs || [];
              
              if (workflowRuns.length === 0) {
                console.log('ℹ️ No workflow runs found yet');
                core.setOutput('last_status', 'none');
                core.setOutput('hours_since', '0');
                core.setOutput('should_restart', 'false');
                return;
              }
              
              const latestRun = workflowRuns[0];
              const lastRunTime = new Date(latestRun.created_at);
              const hoursSinceLastRun = (Date.now() - lastRunTime.getTime()) / (1000 * 60 * 60);
              
              console.log(`Last run: ${latestRun.status} at ${lastRunTime.toISOString()}`);
              console.log(`Hours since last run: ${hoursSinceLastRun.toFixed(2)}`);
              
              core.setOutput('last_status', latestRun.status || 'unknown');
              core.setOutput('hours_since', hoursSinceLastRun.toFixed(2));
              core.setOutput('should_restart', hoursSinceLastRun > 6 ? 'true' : 'false');
              
            } catch (error) {
              console.log(`⚠️ Error checking workflow runs: ${error.message}`);
              core.setOutput('last_status', 'error');
              core.setOutput('hours_since', '0');
              core.setOutput('should_restart', 'false');
            }
      
      - name: 🔄 Restart Bot If Needed
        if: steps.check.outputs.should_restart == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('⚠️ Bot inactive for too long, triggering restart...');
            
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'trading-bot.yml',
                ref: 'main'
              });
              console.log('✅ Restart triggered successfully');
            } catch (error) {
              console.log(`❌ Failed to trigger restart: ${error.message}`);
            }
      
      - name: 📢 Alert on Failure
        if: steps.check.outputs.last_status == 'failure'
        run: |
          python -c "
          import requests
          from datetime import datetime
          
          token = '${{ secrets.TELEGRAM_BOT_TOKEN }}'
          chat_id = '${{ secrets.TELEGRAM_CHAT_ID }}'
          
          if not token or not chat_id:
              print('⚠️ Telegram credentials not set')
              exit(0)
          
          message = '''
          ⚠️ *PERINGATAN BOT TRADING*
          
          Status: GAGAL
          Waktu: ''' + datetime.now().strftime('%Y-%m-%d %H:%M:%S') + '''
          
          Bot akan restart otomatis
          '''
          
          try:
              requests.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  data={'chat_id': chat_id, 'text': message, 'parse_mode': 'Markdown'},
                  timeout=10
              )
          except Exception as e:
              print(f'Alert error: {e}')
          "
